command.list.description=Listar todas as minas
command.list.help.0=Lista os nomes das minas de todos os mundos.
command.pos1.description=Definir o primeiro ponto da seleção
command.pos1.usage=[-feet]
command.pos1.help.0=Seleciona o bloco para o qual você está olhando. Use -feet para selecionar o bloco nos seus pés.
command.pos2.description=Definir o segundo ponto da seleção
command.pos2.usage=[-feet]
command.pos2.help.0=Seleciona o bloco para o qual você está olhando. Use -feet para selecionar o bloco nos seus pés.
command.create.description=Criar uma mina a partir da seleção
command.create.usage=<nome da mina>
command.create.help.0=Use /mrl pos1 e /mrl pos2 ou uma seleção cuboide do WorldEdit. A nova mina começa sem composição.
command.info.description=Exibir informações da mina
command.info.usage=<nome da mina>
command.info.help.0=Exibe composição, intervalo de reset, avisos e configurações. Os minutos restantes são arredondados para cima.
command.set.description=Definir a porcentagem de um bloco
command.set.usage=<nome da mina> <bloco> <porcentagem>%
command.set.help.0=Define ou substitui a porcentagem de um bloco. O total não pode ultrapassar 100%. A parte não atribuída vira ar. Exemplo: /mrl set exemplo stone 80%.
command.unset.description=Remover um bloco da composição
command.unset.usage=<nome da mina> <bloco>
command.unset.help.0=Remove a porcentagem do bloco da composição. A parte não atribuída vira ar.
command.reset.description=Resetar uma mina agora
command.reset.usage=<nome da mina> [-s]
command.reset.help.0=Reseta imediatamente sem alterar o contador automático. Use -s para não exibir o anúncio.
command.flag.description=Alterar configurações da mina
command.flag.usage=<nome da mina> <configuração> <valor>
command.flag.help.0=Configurações disponíveis:
command.flag.help.1=resetDelay: minutos inteiros entre resets automáticos; 0 desativa.
command.flag.help.2=resetWarnings: minutos inteiros positivos separados por vírgulas e menores que resetDelay; 0 limpa a lista. Exemplo: 5,1.
command.flag.help.3=surface: bloco da camada superior; air remove essa configuração.
command.flag.help.4=fillMode: true preenche apenas ar; false substitui todos os blocos.
command.flag.help.5=isSilent: true oculta anúncios de reset automático; os avisos continuam aparecendo.
command.erase.description=Excluir uma mina
command.erase.usage=<nome da mina>
command.erase.help.0=Exclui o cadastro da mina e seu arquivo. Os blocos do mundo não são removidos.
command.stagger.description=Distribuir os resets automáticos
command.stagger.usage=<segundos de espaçamento> <minutos de intervalo>
command.stagger.help.0=Altera apenas minas com o intervalo informado. Minas extras repetem os horários. Outros intervalos não são alterados. Exemplo: /mrl stagger 30 8.
command.reschedule.description=Sincronizar os contadores de reset
command.reschedule.help.0=Reinicia o contador de cada mina com seu intervalo configurado. Minas com intervalos iguais passam a resetar juntas.
command.about.description=Exibir versão e créditos do plugin
command.about.help.0=Exibe a versão instalada do plugin e os créditos do projeto.
command.help.description=Exibir ajuda dos comandos
command.help.usage=[comando]
command.help.help.0=Use /mrl help <comando> para ver detalhes. Nomes de comandos e valores como true, false e -feet não são traduzidos.
invalidMineName=&8[&4MRL&8] &cNome de mina inválido ou arquivo em conflito. Use outro nome sem caracteres especiais.
