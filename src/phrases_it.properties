command.list.description=Elencare tutte le miniere
command.list.help.0=Mostra i nomi delle miniere di tutti i mondi.
command.pos1.description=Impostare il primo punto di selezione
command.pos1.usage=[-feet]
command.pos1.help.0=Seleziona il blocco che stai guardando. Usa -feet per selezionare il blocco ai tuoi piedi.
command.pos2.description=Impostare il secondo punto di selezione
command.pos2.usage=[-feet]
command.pos2.help.0=Seleziona il blocco che stai guardando. Usa -feet per selezionare il blocco ai tuoi piedi.
command.create.description=Creare una miniera dalla selezione
command.create.usage=<nome della miniera>
command.create.help.0=Usa /mrl pos1 e /mrl pos2 o una selezione cuboide di WorldEdit. La nuova miniera non ha una composizione.
command.info.description=Mostrare le informazioni di una miniera
command.info.usage=<nome della miniera>
command.info.help.0=Mostra composizione, intervallo, avvisi e impostazioni. I minuti rimanenti vengono arrotondati per eccesso.
command.set.description=Impostare la percentuale di un blocco
command.set.usage=<nome della miniera> <blocco> <percentuale>%
command.set.help.0=Imposta o sostituisce la percentuale di un blocco. Il totale non può superare il 100%. La parte non assegnata diventa aria. Esempio: /mrl set esempio stone 80%.
command.unset.description=Rimuovere un blocco dalla composizione
command.unset.usage=<nome della miniera> <blocco>
command.unset.help.0=Rimuove la percentuale del blocco dalla composizione. La parte non assegnata diventa aria.
command.reset.description=Ripristinare subito una miniera
command.reset.usage=<nome della miniera> [-s]
command.reset.help.0=Ripristina subito senza modificare il timer automatico. Usa -s per non mostrare l'annuncio.
command.flag.description=Modificare le impostazioni della miniera
command.flag.usage=<nome della miniera> <impostazione> <valore>
command.flag.help.0=Impostazioni disponibili:
command.flag.help.1=resetDelay: minuti interi tra i ripristini automatici; 0 li disattiva.
command.flag.help.2=resetWarnings: minuti interi positivi separati da virgole e inferiori a resetDelay; 0 cancella la lista. Esempio: 5,1.
command.flag.help.3=surface: blocco dello strato superiore; air rimuove questa impostazione.
command.flag.help.4=fillMode: true riempie solo l'aria; false sostituisce tutti i blocchi.
command.flag.help.5=isSilent: true nasconde gli annunci dei ripristini automatici; gli avvisi restano visibili.
command.erase.description=Eliminare una miniera
command.erase.usage=<nome della miniera>
command.erase.help.0=Elimina la definizione della miniera e il suo file. I blocchi del mondo non vengono rimossi. Usa il nome esatto della miniera.
command.stagger.description=Distribuire i ripristini automatici
command.stagger.usage=<distanza in secondi> <intervallo in minuti>
command.stagger.help.0=Modifica solo le miniere con l'intervallo indicato. Le miniere aggiuntive condividono i turni. Gli altri intervalli restano invariati. Esempio: /mrl stagger 30 8.
command.reschedule.description=Sincronizzare i timer di ripristino
command.reschedule.help.0=Riavvia il timer di ogni miniera con il suo intervallo configurato. Le miniere con lo stesso intervallo verranno ripristinate insieme.
command.about.description=Mostrare versione e crediti
command.about.help.0=Mostra la versione installata del plugin e i crediti del progetto.
command.help.description=Mostrare l'aiuto dei comandi
command.help.usage=[comando]
command.help.help.0=Usa /mrl help <comando> per i dettagli. I nomi dei comandi e i valori come true, false e -feet non vengono tradotti.
invalidMineName=&8[&4MRL&8] &cNome della miniera non valido o file in conflitto. Usa un altro nome senza caratteri speciali.
mineEraseFailed=&8[&4MRL&8] &cImpossibile eliminare la miniera &f%0%&c. Consulta il log del server.
