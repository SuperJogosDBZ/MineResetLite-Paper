command.list.description=List all mines
command.list.help.0=List the names of all mines in all worlds.
command.pos1.description=Set the first selection point
command.pos1.usage=[-feet]
command.pos1.help.0=Select the block you are looking at. Use -feet to select the block at your feet.
command.pos2.description=Set the second selection point
command.pos2.usage=[-feet]
command.pos2.help.0=Select the block you are looking at. Use -feet to select the block at your feet.
command.create.description=Create a mine from your selection
command.create.usage=<mine name>
command.create.help.0=Use /mrl pos1 and /mrl pos2, or a WorldEdit cuboid selection. New mines have no block composition.
command.info.description=Show mine information
command.info.usage=<mine name>
command.info.help.0=Show the composition, reset interval, warnings and settings of a mine. Remaining minutes are rounded up.
command.set.description=Set a block's percentage
command.set.usage=<mine name> <block> <percentage>%
command.set.help.0=Set or replace a block's percentage. The total cannot exceed 100%. Unassigned composition becomes air. Example: /mrl set example stone 80%.
command.unset.description=Remove a block from the composition
command.unset.usage=<mine name> <block>
command.unset.help.0=Remove a block's percentage from the composition. The unassigned part becomes air.
command.reset.description=Reset a mine now
command.reset.usage=<mine name> [-s]
command.reset.help.0=Reset immediately without changing the automatic reset timer. Use -s to skip the announcement.
command.flag.description=Change mine settings
command.flag.usage=<mine name> <setting> <value>
command.flag.help.0=Available settings:
command.flag.help.1=resetDelay: whole minutes between automatic resets; 0 disables them.
command.flag.help.2=resetWarnings: comma-separated positive whole minutes below resetDelay; 0 clears the list. Example: 5,1.
command.flag.help.3=surface: block for the top layer; air removes this setting.
command.flag.help.4=fillMode: true fills only air blocks; false replaces all blocks.
command.flag.help.5=isSilent: true hides automatic reset announcements; warnings still appear.
command.erase.description=Delete a mine
command.erase.usage=<mine name>
command.erase.help.0=Delete the mine definition and its saved file. Blocks in the world are not removed. Use the exact mine name.
command.stagger.description=Distribute automatic mine resets
command.stagger.usage=<spacing seconds> <interval minutes>
command.stagger.help.0=Change only mines with the specified reset interval. Extra mines reuse slots. Other intervals stay unchanged. Example: /mrl stagger 30 8.
command.reschedule.description=Synchronize automatic reset timers
command.reschedule.help.0=Restart every mine's countdown using its configured interval. Mines with equal intervals will reset together.
command.about.description=Show plugin version and credits
command.about.help.0=Show the installed plugin version and project credits.
command.help.description=Show command help
command.help.usage=[command]
command.help.help.0=Use /mrl help <command> for details. Command names and values such as true, false and -feet are not translated.
invalidMineName=&8[&4MRL&8] &cInvalid mine name or conflicting file. Use a different name without special characters.
mineEraseFailed=&8[&4MRL&8] &cCould not delete mine &f%0%&c. Check the server log.
