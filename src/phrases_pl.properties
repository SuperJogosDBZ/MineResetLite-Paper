command.list.description=Wyświetl wszystkie kopalnie
command.list.help.0=Wyświetla nazwy kopalń ze wszystkich światów.
command.pos1.description=Ustaw pierwszy punkt zaznaczenia
command.pos1.usage=[-feet]
command.pos1.help.0=Zaznacza blok, na który patrzysz. Użyj -feet, aby zaznaczyć blok przy swoich stopach.
command.pos2.description=Ustaw drugi punkt zaznaczenia
command.pos2.usage=[-feet]
command.pos2.help.0=Zaznacza blok, na który patrzysz. Użyj -feet, aby zaznaczyć blok przy swoich stopach.
command.create.description=Utwórz kopalnię z zaznaczenia
command.create.usage=<nazwa kopalni>
command.create.help.0=Użyj /mrl pos1 i /mrl pos2 lub prostopadłościennego zaznaczenia WorldEdit. Nowa kopalnia nie ma składu bloków.
command.info.description=Wyświetl informacje o kopalni
command.info.usage=<nazwa kopalni>
command.info.help.0=Wyświetla skład, interwał, ostrzeżenia i ustawienia. Pozostałe minuty są zaokrąglane w górę.
command.set.description=Ustaw procentowy udział bloku
command.set.usage=<nazwa kopalni> <blok> <procent>%
command.set.help.0=Ustawia lub zastępuje udział bloku. Suma nie może przekraczać 100%. Nieprzypisana część staje się powietrzem. Przykład: /mrl set przyklad stone 80%.
command.unset.description=Usuń blok ze składu
command.unset.usage=<nazwa kopalni> <blok>
command.unset.help.0=Usuwa udział bloku ze składu. Nieprzypisana część staje się powietrzem.
command.reset.description=Zresetuj kopalnię teraz
command.reset.usage=<nazwa kopalni> [-s]
command.reset.help.0=Resetuje natychmiast bez zmiany licznika automatycznego resetu. Użyj -s, aby pominąć komunikat.
command.flag.description=Zmień ustawienia kopalni
command.flag.usage=<nazwa kopalni> <ustawienie> <wartość>
command.flag.help.0=Dostępne ustawienia:
command.flag.help.1=resetDelay: całkowita liczba minut między automatycznymi resetami; 0 je wyłącza.
command.flag.help.2=resetWarnings: dodatnie całkowite liczby minut oddzielone przecinkami, mniejsze niż resetDelay; 0 czyści listę. Przykład: 5,1.
command.flag.help.3=surface: blok górnej warstwy; air usuwa to ustawienie.
command.flag.help.4=fillMode: true wypełnia tylko powietrze; false zastępuje wszystkie bloki.
command.flag.help.5=isSilent: true ukrywa komunikaty o automatycznym resecie; ostrzeżenia nadal są widoczne.
command.erase.description=Usuń kopalnię
command.erase.usage=<nazwa kopalni>
command.erase.help.0=Usuwa definicję kopalni i jej zapisany plik. Bloki w świecie nie są usuwane.
command.stagger.description=Rozłóż automatyczne resety w czasie
command.stagger.usage=<odstęp w sekundach> <interwał w minutach>
command.stagger.help.0=Zmienia tylko kopalnie z podanym interwałem. Dodatkowe kopalnie dzielą terminy. Inne interwały pozostają bez zmian. Przykład: /mrl stagger 30 8.
command.reschedule.description=Zsynchronizuj liczniki resetów
command.reschedule.help.0=Uruchamia ponownie licznik każdej kopalni z jej ustawionym interwałem. Kopalnie z tym samym interwałem będą resetowane jednocześnie.
command.about.description=Wyświetl wersję i autorów
command.about.help.0=Wyświetla zainstalowaną wersję wtyczki i autorów projektu.
command.help.description=Wyświetl pomoc poleceń
command.help.usage=[polecenie]
command.help.help.0=Użyj /mrl help <polecenie>, aby zobaczyć szczegóły. Nazwy poleceń i wartości takie jak true, false oraz -feet nie są tłumaczone.
