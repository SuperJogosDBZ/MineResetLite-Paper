command.list.description=Lister toutes les mines
command.list.help.0=Affiche les noms des mines de tous les mondes.
command.pos1.description=Définir le premier point de sélection
command.pos1.usage=[-feet]
command.pos1.help.0=Sélectionne le bloc que vous regardez. Utilisez -feet pour sélectionner le bloc à vos pieds.
command.pos2.description=Définir le deuxième point de sélection
command.pos2.usage=[-feet]
command.pos2.help.0=Sélectionne le bloc que vous regardez. Utilisez -feet pour sélectionner le bloc à vos pieds.
command.create.description=Créer une mine à partir de la sélection
command.create.usage=<nom de la mine>
command.create.help.0=Utilisez /mrl pos1 et /mrl pos2 ou une sélection cuboïde WorldEdit. La nouvelle mine n'a pas de composition.
command.info.description=Afficher les informations d'une mine
command.info.usage=<nom de la mine>
command.info.help.0=Affiche la composition, l'intervalle, les avertissements et les paramètres. Les minutes restantes sont arrondies à l'entier supérieur.
command.set.description=Définir le pourcentage d'un bloc
command.set.usage=<nom de la mine> <bloc> <pourcentage>%
command.set.help.0=Définit ou remplace le pourcentage d'un bloc. Le total ne peut pas dépasser 100%. La part non attribuée devient de l'air. Exemple : /mrl set exemple stone 80%.
command.unset.description=Retirer un bloc de la composition
command.unset.usage=<nom de la mine> <bloc>
command.unset.help.0=Retire le pourcentage du bloc de la composition. La part non attribuée devient de l'air.
command.reset.description=Réinitialiser une mine maintenant
command.reset.usage=<nom de la mine> [-s]
command.reset.help.0=Réinitialise immédiatement sans modifier le compteur automatique. Utilisez -s pour masquer l'annonce.
command.flag.description=Modifier les paramètres d'une mine
command.flag.usage=<nom de la mine> <paramètre> <valeur>
command.flag.help.0=Paramètres disponibles :
command.flag.help.1=resetDelay : minutes entières entre les réinitialisations automatiques ; 0 les désactive.
command.flag.help.2=resetWarnings : minutes entières positives séparées par des virgules et inférieures à resetDelay ; 0 efface la liste. Exemple : 5,1.
command.flag.help.3=surface : bloc de la couche supérieure ; air supprime ce paramètre.
command.flag.help.4=fillMode : true remplit uniquement l'air ; false remplace tous les blocs.
command.flag.help.5=isSilent : true masque les annonces de réinitialisation automatique ; les avertissements restent visibles.
command.erase.description=Supprimer une mine
command.erase.usage=<nom de la mine>
command.erase.help.0=Supprime la définition de la mine et son fichier. Les blocs du monde ne sont pas supprimés.
command.stagger.description=Répartir les réinitialisations automatiques
command.stagger.usage=<espacement en secondes> <intervalle en minutes>
command.stagger.help.0=Modifie uniquement les mines ayant l'intervalle indiqué. Les mines supplémentaires partagent les créneaux. Les autres intervalles restent inchangés. Exemple : /mrl stagger 30 8.
command.reschedule.description=Synchroniser les compteurs de réinitialisation
command.reschedule.help.0=Relance le compteur de chaque mine avec son intervalle configuré. Les mines ayant le même intervalle seront réinitialisées ensemble.
command.about.description=Afficher la version et les crédits
command.about.help.0=Affiche la version installée du plugin et les crédits du projet.
command.help.description=Afficher l'aide des commandes
command.help.usage=[commande]
command.help.help.0=Utilisez /mrl help <commande> pour les détails. Les noms des commandes et les valeurs comme true, false et -feet ne sont pas traduits.
