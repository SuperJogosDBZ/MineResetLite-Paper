command.list.description=Listar todas las minas
command.list.help.0=Muestra los nombres de las minas de todos los mundos.
command.pos1.description=Definir el primer punto de selección
command.pos1.usage=[-feet]
command.pos1.help.0=Selecciona el bloque que estás mirando. Usa -feet para seleccionar el bloque a tus pies.
command.pos2.description=Definir el segundo punto de selección
command.pos2.usage=[-feet]
command.pos2.help.0=Selecciona el bloque que estás mirando. Usa -feet para seleccionar el bloque a tus pies.
command.create.description=Crear una mina a partir de la selección
command.create.usage=<nombre de la mina>
command.create.help.0=Usa /mrl pos1 y /mrl pos2 o una selección cuboide de WorldEdit. La nueva mina empieza sin composición.
command.info.description=Mostrar información de una mina
command.info.usage=<nombre de la mina>
command.info.help.0=Muestra la composición, el intervalo, los avisos y las opciones. Los minutos restantes se redondean hacia arriba.
command.set.description=Definir el porcentaje de un bloque
command.set.usage=<nombre de la mina> <bloque> <porcentaje>%
command.set.help.0=Define o sustituye el porcentaje de un bloque. El total no puede superar el 100%. La parte sin asignar se convierte en aire. Ejemplo: /mrl set ejemplo stone 80%.
command.unset.description=Eliminar un bloque de la composición
command.unset.usage=<nombre de la mina> <bloque>
command.unset.help.0=Elimina el porcentaje del bloque de la composición. La parte sin asignar se convierte en aire.
command.reset.description=Reiniciar una mina ahora
command.reset.usage=<nombre de la mina> [-s]
command.reset.help.0=Reinicia inmediatamente sin cambiar el contador automático. Usa -s para omitir el anuncio.
command.flag.description=Cambiar las opciones de una mina
command.flag.usage=<nombre de la mina> <opción> <valor>
command.flag.help.0=Opciones disponibles:
command.flag.help.1=resetDelay: minutos enteros entre reinicios automáticos; 0 los desactiva.
command.flag.help.2=resetWarnings: minutos enteros positivos separados por comas y menores que resetDelay; 0 borra la lista. Ejemplo: 5,1.
command.flag.help.3=surface: bloque de la capa superior; air elimina esta opción.
command.flag.help.4=fillMode: true rellena solo aire; false sustituye todos los bloques.
command.flag.help.5=isSilent: true oculta los anuncios de reinicio automático; los avisos siguen apareciendo.
command.erase.description=Eliminar una mina
command.erase.usage=<nombre de la mina>
command.erase.help.0=Elimina la definición de la mina y su archivo. No elimina los bloques del mundo.
command.stagger.description=Distribuir los reinicios automáticos
command.stagger.usage=<segundos de separación> <minutos de intervalo>
command.stagger.help.0=Solo cambia las minas con el intervalo indicado. Las minas adicionales comparten turnos. No modifica otros intervalos. Ejemplo: /mrl stagger 30 8.
command.reschedule.description=Sincronizar los contadores de reinicio
command.reschedule.help.0=Reinicia el contador de cada mina con su intervalo configurado. Las minas con el mismo intervalo se reiniciarán juntas.
command.about.description=Mostrar la versión y los créditos
command.about.help.0=Muestra la versión instalada del plugin y los créditos del proyecto.
command.help.description=Mostrar ayuda de los comandos
command.help.usage=[comando]
command.help.help.0=Usa /mrl help <comando> para ver los detalles. Los nombres de comandos y valores como true, false y -feet no se traducen.
invalidMineName=&8[&4MRL&8] &cNombre de mina inválido o archivo en conflicto. Usa otro nombre sin caracteres especiales.
mineEraseFailed=&8[&4MRL&8] &cNo se pudo eliminar la mina &f%0%&c. Consulta el registro del servidor.
