command.list.description=Alle mijnen weergeven
command.list.help.0=Toont de namen van mijnen in alle werelden.
command.pos1.description=Het eerste selectiepunt instellen
command.pos1.usage=[-feet]
command.pos1.help.0=Selecteert het blok waarnaar je kijkt. Gebruik -feet om het blok bij je voeten te selecteren.
command.pos2.description=Het tweede selectiepunt instellen
command.pos2.usage=[-feet]
command.pos2.help.0=Selecteert het blok waarnaar je kijkt. Gebruik -feet om het blok bij je voeten te selecteren.
command.create.description=Een mijn vanuit je selectie maken
command.create.usage=<mijnnaam>
command.create.help.0=Gebruik /mrl pos1 en /mrl pos2 of een balkvormige WorldEdit-selectie. Nieuwe mijnen hebben nog geen samenstelling.
command.info.description=Mijninformatie weergeven
command.info.usage=<mijnnaam>
command.info.help.0=Toont samenstelling, interval, waarschuwingen en instellingen. Resterende minuten worden naar boven afgerond.
command.set.description=Het percentage van een blok instellen
command.set.usage=<mijnnaam> <blok> <percentage>%
command.set.help.0=Stelt het percentage van een blok in of vervangt het. Het totaal mag niet hoger zijn dan 100%. Het niet-toegewezen deel wordt lucht. Voorbeeld: /mrl set voorbeeld stone 80%.
command.unset.description=Een blok uit de samenstelling verwijderen
command.unset.usage=<mijnnaam> <blok>
command.unset.help.0=Verwijdert het percentage van het blok uit de samenstelling. Het niet-toegewezen deel wordt lucht.
command.reset.description=Een mijn nu resetten
command.reset.usage=<mijnnaam> [-s]
command.reset.help.0=Reset onmiddellijk zonder de automatische timer te wijzigen. Gebruik -s om de melding over te slaan.
command.flag.description=Mijninstellingen wijzigen
command.flag.usage=<mijnnaam> <instelling> <waarde>
command.flag.help.0=Beschikbare instellingen:
command.flag.help.1=resetDelay: gehele minuten tussen automatische resets; 0 schakelt ze uit.
command.flag.help.2=resetWarnings: positieve gehele minuten gescheiden door komma's en kleiner dan resetDelay; 0 wist de lijst. Voorbeeld: 5,1.
command.flag.help.3=surface: blok voor de bovenste laag; air verwijdert deze instelling.
command.flag.help.4=fillMode: true vult alleen lucht; false vervangt alle blokken.
command.flag.help.5=isSilent: true verbergt automatische resetmeldingen; waarschuwingen blijven zichtbaar.
command.erase.description=Een mijn verwijderen
command.erase.usage=<mijnnaam>
command.erase.help.0=Verwijdert de mijndefinitie en het opgeslagen bestand. Blokken in de wereld worden niet verwijderd. Gebruik de exacte mijnnaam.
command.stagger.description=Automatische mijnresets spreiden
command.stagger.usage=<spreiding in seconden> <interval in minuten>
command.stagger.help.0=Wijzigt alleen mijnen met het opgegeven interval. Extra mijnen delen tijdstippen. Andere intervallen blijven ongewijzigd. Voorbeeld: /mrl stagger 30 8.
command.reschedule.description=Automatische resettimers synchroniseren
command.reschedule.help.0=Start de teller van elke mijn opnieuw met het ingestelde interval. Mijnen met hetzelfde interval worden tegelijk gereset.
command.about.description=Versie en credits weergeven
command.about.help.0=Toont de geïnstalleerde pluginversie en de projectcredits.
command.help.description=Hulp bij commando's weergeven
command.help.usage=[commando]
