command.create.help.0=Brug /mrl pos1 og /mrl pos2 eller en kasseformet WorldEdit-markering. Nye miner har ingen bloksammensætning.
command.info.description=Vis oplysninger om en mine
command.info.usage=<minenavn>
command.info.help.0=Viser sammensætning, interval, advarsler og indstillinger. Resterende minutter rundes op.
command.set.description=Angiv en bloks procentdel
command.set.usage=<minenavn> <blok> <procentdel>%
command.set.help.0=Angiver eller erstatter en bloks procentdel. Summen må ikke overstige 100%. Den ikke-tildelte del bliver luft. Eksempel: /mrl set eksempel stone 80%.
command.unset.description=Fjern en blok fra sammensætningen
command.unset.usage=<minenavn> <blok>
command.unset.help.0=Fjerner blokkens procentdel fra sammensætningen. Den ikke-tildelte del bliver luft.
command.reset.description=Nulstil en mine nu
command.reset.usage=<minenavn> [-s]
command.reset.help.0=Nulstiller straks uden at ændre den automatiske timer. Brug -s for at springe meddelelsen over.
command.flag.description=Skift mineindstillinger
command.flag.usage=<minenavn> <indstilling> <værdi>
command.flag.help.0=Tilgængelige indstillinger:
command.flag.help.1=resetDelay: hele minutter mellem automatiske nulstillinger; 0 deaktiverer dem.
command.flag.help.2=resetWarnings: positive hele minutter adskilt af kommaer og mindre end resetDelay; 0 rydder listen. Eksempel: 5,1.
command.flag.help.3=surface: blok til det øverste lag; air fjerner indstillingen.
command.flag.help.4=fillMode: true fylder kun luft; false erstatter alle blokke.
command.flag.help.5=isSilent: true skjuler meddelelser om automatisk nulstilling; advarsler vises stadig.
command.erase.description=Slet en mine
command.erase.usage=<minenavn>
command.erase.help.0=Sletter minens definition og gemte fil. Blokke i verden bliver ikke fjernet.
command.stagger.description=Fordel automatiske nulstillinger
command.stagger.usage=<afstand i sekunder> <interval i minutter>
command.stagger.help.0=Ændrer kun miner med det angivne interval. Ekstra miner deler tidspunkter. Andre intervaller ændres ikke. Eksempel: /mrl stagger 30 8.
command.reschedule.description=Synkroniser automatiske nulstillingstimere
command.reschedule.help.0=Genstarter hver mines nedtælling med dens indstillede interval. Miner med samme interval nulstilles samtidigt.
command.about.description=Vis version og kreditering
command.about.help.0=Viser den installerede pluginversion og projektets kreditering.
