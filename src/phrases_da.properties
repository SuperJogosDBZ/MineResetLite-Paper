command.pos2.description=Vælg det andet markeringspunkt
command.pos2.usage=[-feet]
command.pos2.help.0=Vælger den blok, du ser på. Brug -feet for at vælge blokken ved dine fødder.
command.create.description=Opret en mine fra din markering
